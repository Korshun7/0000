# BR-01 Спальня — геометрия и расстановка, без электрики
# Единицы: мм, площади: м²
# Нулевая точка: внутренний юго-западный угол (запад × юг)
# X → восток, Y → север, Z → вверх от чистого пола
#
# Внутренний север: 455 (слева от проёма) + 855 (дверь) + 1890
# Наружная цепочка 130+658+855+180 к внутреннему контуру не относится

id: BR-01
название: Спальня
назначение: спальная зона + ТВ + рабочее место
этаж: null  # дообмерить
источники:
  обмер: rooms/plans/BR-01-obmer.jpg
  расстановка: rooms/plans/BR-01-rasstanovka.jpg

координаты:
  ноль: внутренний ЮЗ угол
  ось_x: восток
  ось_y: север
  ось_z: от чистого пола вверх
  единицы: мм

контур:
  форма: прямоугольник + юго-восточная ниша (Г-образная)
  углы: 90
  перекосы: null  # снять на объекте
  площадь_пола: 16.16
  периметр: 16.98
  периметр_минус_дверь: 16.13
  высота_потолка: null
  высота_до_перекрытия: null

  габариты:
    длина_запад_y: 4550
    ширина_север_x: 3200   # 455 + 855 + 1890
    ширина_юг_x: 3940      # 1100 + 1730 + 1110
    ниша_глубина_x: 740    # 3940 - 3200
    ниша_длина_y: 2165
    восток_север_y: 2385
    контроль_y: 4550       # 2385 + 2165

  зоны_пола:
    - id: MAIN
      описание: основной прямоугольник
      x0: 0
      y0: 0
      x1: 3200
      y1: 4550
      площадь_м2: 14.560
    - id: NICHE
      описание: ниша шкафа-купе
      x0: 3200
      y0: 0
      x1: 3940
      y1: 2165
      площадь_м2: 1.602

стены:
  - id: A
    имя: западная
    от: [0, 0]
    до: [0, 4550]
    длина: 4550
    толщина: 130          # по обмеру сверху слева, снаружи
    несущая: null
    материал: null
    отделка: null
  - id: B
    имя: северная
    от: [0, 4550]
    до: [3200, 4550]
    длина: 3200
    толщина_пенала: 180   # наружная цепочка справа от проёма
    несущая: null
    материал: null
    участки:
      - от_x: 0
        длина: 455
        тип: простенок
        назначение: книжный шкаф, слева от дверного проёма
      - от_x: 455
        длина: 855
        тип: проём
        ссылка: BR-01-D1
      - от_x: 1310
        длина: 1890
        тип: простенок
        назначение: карман раздвижной двери (вероятнее вправо)
  - id: C
    имя: восточная северная часть
    от: [3200, 4550]
    до: [3200, 2165]
    длина: 2385
    несущая: null
    материал: null
    назначение: изголовье кровати и тумбы
  - id: D
    имя: север ниши
    от: [3200, 2165]
    до: [3940, 2165]
    длина: 740
    несущая: null
    материал: null
  - id: E
    имя: восток ниши
    от: [3940, 2165]
    до: [3940, 0]
    длина: 2165
    несущая: null
    материал: null
    назначение: задняя стенка шкафа-купе
    смежные_размеры_на_чертеже:  # не входят в площадь BR-01; лежат на линии стены E
      торец_или_толщина: 350
      проём_смежного: 715
      до_южной_стены: 1100
      контроль: 2165
  - id: F
    имя: южная
    от: [3940, 0]
    до: [0, 0]
    длина: 3940
    несущая: null
    материал: null
    участки:
      - от_x: 0
        длина: 1100
        тип: простенок
        назначение: компьютерный стол
      - от_x: 1100
        длина: 1730
        тип: проём
        ссылка: BR-01-W1
      - от_x: 2830
        длина: 1110
        тип: простенок
        из_них_до_стены_C: 370
        из_них_юг_ниши: 740

проёмы:
  двери:
    - id: BR-01-D1
      тип: раздвижная
      створок: 1
      стена: B
      ширина_проёма: 855
      высота_проёма: null
      глубина_откоса: null  # не путать с простенком 455 слева от проёма
      левый_косяк_x: 455
      правый_косяк_x: 1310
      y_линии_комнаты: 4550
      направление_отката: вправо_восток  # 455 < 855, влево полотно не спрячется
      порог: null
  окна:
    - id: BR-01-W1
      стена: F
      ширина_проёма: 1730
      высота_проёма: null
      высота_подоконника: null
      глубина_откоса: null
      левый_откос_x: 1100
      правый_откос_x: 2830
      радиатор: вероятно_под_окном
      шторы: да  # по плану расстановки

наружная_цепочка_северной_стены:
  примечание: не внутренний контур; 658 не есть простенок слева от двери
  размеры: [130, 658, 855, 180]

смежные_конструкции_не_в_контуре:
  - размер: 95
    где: северо-восток снаружи
  - размер: 2370
    где: вертикаль массива стены восточнее северной части комнаты

расстановка:
  - id: F-01
    предмет: книжный шкаф
    зона: северо-западный угол
    стены: [A, B]
    габарит_вдоль_B: 455
    габарит_вдоль_A: null
  - id: F-02
    предмет: витрина
    стена: A
    положение: южнее F-01
  - id: F-03
    предмет: тумба под ТВ
    стена: A
    положение: южнее F-02
  - id: F-04
    предмет: кресло
    стена: A
    положение: южнее F-03
  - id: F-05
    предмет: компьютерный стол
    стены: [A, F]
    положение: юго-западный угол
    ширина_вдоль_F: 1100  # совпадает с левым простенком окна
    глубина_вдоль_A: null
  - id: F-06
    предмет: кровать
    размер: [1900, 1500]  # длина X × ширина Y
    изголовье: восток
    стена_изголовья: C
    x_изголовья: 3200
    x_ног: 1300           # 3200 - 1900
    # Y: тумбы + 1500 = 2385, при равных тумбах ≈ 442 + 1500 + 443
    y_юг: 2607            # 2165 + 442
    y_север: 4107         # 2607 + 1500
    примечание: y тумб оценочные, если тумбы равные и без зазоров
  - id: F-07
    предмет: тумба прикроватная северная
    стена: C
    y_ориентир: [4107, 4550]
    длина_вдоль_C_оценка: 443
  - id: F-08
    предмет: тумба прикроватная южная
    стена: C
    угол: [3200, 2165]
    y_ориентир: [2165, 2607]
    длина_вдоль_C_оценка: 442
  - id: F-09
    предмет: шкаф-купе
    ниша: NICHE
    фасад_x: 3200
    фасад_длина: 2165
    глубина_ниши: 740
    двери: купе, смотрят на запад
  - id: F-10
    предмет: люстра
    примечание: на плане расстановки, 6 рожков, свободная зона южнее кровати
    электрика: не заполняется
  - id: F-11
    предмет: шторы
    стена: F
    зона: BR-01-W1

электрика: []  # следующий шаг

дообмер:
  - высота чистого потолка (4 угла + центр)
  - высота до перекрытия
  - высота проёма D1 и сторона отката
  - толщина северной стены в проёме D1
  - высота окна, подоконника, глубина откоса, радиатор
  - материал и несущие стены A–F
  - диагонали и перепад пола, стык отметки через D1
  - фактическая глубина ниши в свету под купе
  - назначение оранжевого контура на расстановке
  - этаж и мокрые зоны за стеной E

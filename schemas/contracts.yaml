# JSON contracts (logical). Enforce in orchestrator with Pydantic/JSON Schema
# AND on the model side with GBNF.

classifier_output:
  type: object
  required: [priority, needs_reply, intent, language, suggested_folder, deadline_hint, entities, confidence, summary]
  additionalProperties: false
  properties:
    priority: { type: integer, minimum: 0, maximum: 100 }
    needs_reply: { type: boolean }
    intent:
      type: string
      enum: [question, request, fyi, meeting, invoice, legal, newsletter, ndr, other]
    language: { type: string, minLength: 2, maxLength: 16 }
    suggested_folder: { type: string, maxLength: 128 }
    deadline_hint: { type: string, maxLength: 128 }
    entities:
      type: array
      items:
        type: object
        required: [type, value]
        additionalProperties: false
        properties:
          type: { type: string, enum: [date, money, person, org, id, other] }
          value: { type: string, maxLength: 256 }
    confidence: { type: number, minimum: 0, maximum: 1 }
    summary: { type: string, maxLength: 600 }

draft_output:
  type: object
  required: [variants]
  additionalProperties: false
  properties:
    variants:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: object
        required: [variant, kind, subject, body_text, citations, risks]
        additionalProperties: false
        properties:
          variant: { type: integer, enum: [1, 2, 3] }
          kind: { type: string, enum: [short_formal, detailed, clarifying] }
          subject: { type: string, maxLength: 200 }
          body_text: { type: string, minLength: 1, maxLength: 8000 }
          citations:
            type: array
            items:
              type: object
              required: [entry_id, claim]
              properties:
                entry_id: { type: string, minLength: 8 }
                claim: { type: string, maxLength: 400 }
          risks:
            type: array
            items: { type: string, maxLength: 300 }
